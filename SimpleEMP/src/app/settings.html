<div class="settings-container">
  <div class="settings-header">
    <h1>System Customizer</h1>
    <p>Choose your preferred Font, Color, and Toolbar position below.</p>
  </div>

  <div class="customizer-layout">

    <!-- 0. Theme Appearance Section -->
    <div class="settings-card full-width">
      <div class="section-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <h2>Theme Appearance</h2>
      </div>
      <div class="appearance-grid">
        <div *ngFor="let mode of themeModes" 
             class="appearance-box" 
             [class.active]="settings.themeMode === mode.value"
             (click)="settings.themeMode = mode.value; updateSettings()">
          <div class="mode-icon">
            <!-- Dynamic Icon (simplifying for now with text if svg is complex) -->
            <span class="icon-label">{{ mode.name }}</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 1. Font Style Section -->
    <div class="settings-card">
      <div class="section-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
        <h2>Font Style</h2>
      </div>
      <div class="selection-grid">
        <div *ngFor="let font of fonts" 
             class="select-box" 
             [class.active]="settings.fontFamily === font.value"
             (click)="settings.fontFamily = font.value; updateSettings()">
          <span [style.font-family]="font.value">{{ font.name }}</span>
        </div>
      </div>
    </div>

    <!-- 2. Primary Color Section -->
    <div class="settings-card">
      <div class="section-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        <h2>Brand Color</h2>
      </div>
      <div class="color-grid">
        <div *ngFor="let color of colors" 
             class="color-circle" 
             [style.background]="color.value"
             [class.active]="settings.primaryColor === color.value"
             (click)="settings.primaryColor = color.value; updateSettings()"
             [title]="color.name">
          <div class="check" *ngIf="settings.primaryColor === color.value">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Toolbar Position Section -->
    <div class="settings-card">
      <div class="section-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        <h2>Toolbar Position</h2>
      </div>
      <div class="layout-selection">
        <div *ngFor="let l of layouts" 
             class="layout-box" 
             [class.active]="settings.layoutPosition === l.value"
             (click)="settings.layoutPosition = l.value; updateSettings()">
          <div class="layout-preview" [class]="l.value">
            <div class="bar"></div>
            <div class="content"></div>
          </div>
          <span>{{ l.name }}</span>
        </div>
      </div>
    </div>

  </div>

  <div class="settings-footer">
    <button class="reset-btn" (click)="reset()">Reset All to Default</button>
  </div>
</div>
